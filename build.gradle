plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'co.uzzu.dotenv.gradle' version "4.0.0"
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        name = "FTB Maven"
        url = "https://maven.ftb.dev/releases"
    }
    maven {
        name = "Architectury Maven"
        url = "https://maven.architectury.dev/"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
    flatDir {
        dir 'libs'
    }
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "curse.maven:ftb-chunks-forge-${project.ftb_chunks_project_id}:${project.ftb_chunks_file_id}"
    implementation "curse.maven:ftb-library-forge-${project.ftb_library_project_id}:${project.ftb_library_file_id}"
    implementation "curse.maven:ftb-teams-forge-${project.ftb_teams_project_id}:${project.ftb_teams_file_id}"
    implementation "curse.maven:architectury-api-${project.architectury_project_id}:${project.architectury_file_id}"
    implementation "curse.maven:millenaire-${project.millenaire_project_id}:${project.millenaire_file_id}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

publishMods {
    file = jar.archiveFile
    changelog = file("CHANGELOG.md").text
    type = STABLE
    modLoaders.add("neoforge")

    curseforge {
        accessToken = env.fetchOrNull("CURSEFORGE_TOKEN") ?: System.getProperty("CURSEFORGE_TOKEN")
        projectId = project.hasProperty("curseforge_project_id") ? project.property("curseforge_project_id") : "0"
        minecraftVersions.add(project.minecraft_version)
        clientRequired = true
        serverRequired = true
        displayName = "[NeoForge] " + project.mod_name + " " + project.version
        requires {
            slug = "ftb-chunks-forge"
        }
        requires {
            slug = "millenaire"
        }
    }

    modrinth {
        accessToken = env.fetchOrNull("MODRINTH_TOKEN") ?: System.getProperty("MODRINTH_TOKEN")
        projectId = project.hasProperty("modrinth_project_id") ? project.property("modrinth_project_id") : ""
        minecraftVersions.add(project.minecraft_version)
        displayName = "[NeoForge] " + project.mod_name + " " + project.version
        requires {
            slug = "ftb-chunks"
        }
        requires {
            slug = "millenaire"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
